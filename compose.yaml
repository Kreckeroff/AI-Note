name: sever-dev

services:
  app:
    build: .
    restart: unless-stopped
    command: ["/bin/sh", "-ec", "sever migrate && exec sever serve"]
    environment:
      SEVER_BIND_ADDR: "0.0.0.0"
      SEVER_HTTP_HOST: "localhost"
      SEVER_PORT: "4125"
      SEVER_SELF_REGISTRATION: "false"
      SEVER_TEAMSTREAM_ORIGIN: "http://127.0.0.1:4124"
      SEVER_SHARING_SECRET: "${SEVER_SHARING_SECRET:-}"
      SEVER_SHARING_SENDMAIL: "${SEVER_SHARING_SENDMAIL:-}"
      SEVER_SHARING_FROM: "${SEVER_SHARING_FROM:-}"
      SEVER_DATABASE_URL: "postgresql://sever:${SEVER_DEV_DB_PASSWORD:?Set SEVER_DEV_DB_PASSWORD}@db:5432/sever_dev"
    ports:
      - "127.0.0.1:4125:4125"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/4125"]
      interval: 3s
      timeout: 2s
      retries: 10

  teamstream:
    build: .
    restart: unless-stopped
    command: ["sever", "serve-teamstream"]
    environment:
      SEVER_BIND_ADDR: "0.0.0.0"
      SEVER_PORT: "4124"
      SEVER_TEAMSTREAM_PARENT_ORIGIN: "http://localhost:4125"
      SEVER_TEAMSTREAM_ORIGIN: "http://127.0.0.1:4124"
    networks: [teamstream-player]
    ports:
      - "127.0.0.1:4124:4124"
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/4124"]
      interval: 3s
      timeout: 2s
      retries: 10

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sever_dev
      POSTGRES_USER: sever
      POSTGRES_PASSWORD: "${SEVER_DEV_DB_PASSWORD:?Set SEVER_DEV_DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sever", "-d", "sever_dev"]
      interval: 3s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:

networks:
  teamstream-player:
